<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404"><rect width="100%" height="100%" fill="white"/><style>text{font:19px Arial,sans-serif;fill:#111}path,line,ellipse,circle,rect{stroke-linejoin:round}</style><rect x="20.0" y="20" width="430.0" height="52" fill="#eef1f5" stroke="#555"/><text x="30.0" y="50" style="font-size:17px">Тэмдэг</text><rect x="450.0" y="20" width="430.0" height="52" fill="#eef1f5" stroke="#555"/><text x="460.0" y="50" style="font-size:17px">Өгөгдөл</text><rect x="20.0" y="72" width="430.0" height="52" fill="white" stroke="#555"/><text x="30.0" y="102" style="font-size:17px">a</text><rect x="450.0" y="72" width="430.0" height="52" fill="white" stroke="#555"/><text x="460.0" y="102" style="font-size:17px">Амьдрах орчны ерөнхий бохирдол</text><rect x="20.0" y="124" width="430.0" height="52" fill="white" stroke="#555"/><text x="30.0" y="154" style="font-size:17px">b</text><rect x="450.0" y="124" width="430.0" height="52" fill="white" stroke="#555"/><text x="460.0" y="154" style="font-size:17px">Хүн, байгалийн тэнцвэр ноцтой алдагдах</text><rect x="20.0" y="176" width="430.0" height="52" fill="white" stroke="#555"/><text x="30.0" y="206" style="font-size:17px">c</text><rect x="450.0" y="176" width="430.0" height="52" fill="white" stroke="#555"/><text x="460.0" y="206" style="font-size:17px">Бодит хор учруулж болзошгүй нөхцөл</text><rect x="20.0" y="228" width="430.0" height="52" fill="white" stroke="#555"/><text x="30.0" y="258" style="font-size:17px">d</text><rect x="450.0" y="228" width="430.0" height="52" fill="white" stroke="#555"/><text x="460.0" y="258" style="font-size:17px">Экологийн хэвийн байдлыг хамгаалсан нөхцөл</text><rect x="20.0" y="280" width="430.0" height="52" fill="white" stroke="#555"/><text x="30.0" y="310" style="font-size:17px">e</text><rect x="450.0" y="280" width="430.0" height="52" fill="white" stroke="#555"/><text x="460.0" y="310" style="font-size:17px">Аюулд өртөх магадлал ба хохирлын хэмжүүр</text><rect x="20.0" y="332" width="430.0" height="52" fill="white" stroke="#555"/><text x="30.0" y="362" style="font-size:17px">f</text><rect x="450.0" y="332" width="430.0" height="52" fill="white" stroke="#555"/><text x="460.0" y="362" style="font-size:17px">Хорт бодис зөвшөөрөх хэмжээнээс ихсэх</text></svg>