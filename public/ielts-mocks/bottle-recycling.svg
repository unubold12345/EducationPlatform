<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 510" role="img"><title>Recycling used glass bottles</title><rect width="890" height="510" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="445" y="40" font-size="23" text-anchor="middle">Glass bottle recycling process</text><rect x="30" y="85" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="155" y="116" text-anchor="middle" font-size="20">Collection</text><text x="155" y="145" text-anchor="middle" font-size="16">Used bottles</text><rect x="320" y="85" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="445" y="116" text-anchor="middle" font-size="20">Sorting</text><text x="445" y="145" text-anchor="middle" font-size="16">By glass colour</text><rect x="610" y="85" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="735" y="116" text-anchor="middle" font-size="20">Washing</text><text x="735" y="145" text-anchor="middle" font-size="16">Labels removed</text><rect x="610" y="225" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="735" y="256" text-anchor="middle" font-size="20">Crushing</text><text x="735" y="285" text-anchor="middle" font-size="16">Glass fragments</text><rect x="320" y="225" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="445" y="256" text-anchor="middle" font-size="20">Melting</text><text x="445" y="285" text-anchor="middle" font-size="16">Furnace: 1,400°C</text><rect x="30" y="225" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="155" y="256" text-anchor="middle" font-size="20">Moulding</text><text x="155" y="285" text-anchor="middle" font-size="16">New bottles</text><rect x="30" y="365" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="155" y="396" text-anchor="middle" font-size="20">Cooling</text><text x="155" y="425" text-anchor="middle" font-size="16">Gradually</text><rect x="320" y="365" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="445" y="396" text-anchor="middle" font-size="20">Inspection</text><text x="445" y="425" text-anchor="middle" font-size="16">Damaged glass → crushing</text><rect x="610" y="365" width="250" height="85" rx="5" fill="#f1f5f9" stroke="#334155"/><text x="735" y="396" text-anchor="middle" font-size="20">Distribution</text><text x="735" y="425" text-anchor="middle" font-size="16">Approved bottles</text></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M280 127H310"/><path d="M570 127H600"/><path d="M735 170V215"/><path d="M610 267H580"/><path d="M320 267H290"/><path d="M155 310V355"/><path d="M280 407H310"/><path d="M570 407H600"/><path d="M445 365V338H875V267H860"/></g><text x="740" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172033">Rejected glass returns to crushing</text></svg>