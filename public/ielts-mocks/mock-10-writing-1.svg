<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Used cork stoppers → floor panels</title><rect width="1000" height="620" fill="white"/><g font-family="Arial, sans-serif"><text x="40" y="45" font-size="24" text-anchor="start" fill="#18232c">Used cork stoppers → floor panels</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#384e60"/></marker></defs><rect x="60" y="95" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="170.0" y="121.5" font-size="17" text-anchor="middle" fill="#18232c">Collect used</text><text x="170.0" y="143.5" font-size="17" text-anchor="middle" fill="#18232c">cork stoppers</text><rect x="370" y="95" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="480.0" y="132.5" font-size="17" text-anchor="middle" fill="#18232c">Sort input</text><rect x="680" y="95" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="790.0" y="121.5" font-size="17" text-anchor="middle" fill="#18232c">Wash accepted</text><text x="790.0" y="143.5" font-size="17" text-anchor="middle" fill="#18232c">cork</text><rect x="680" y="255" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="790.0" y="281.5" font-size="17" text-anchor="middle" fill="#18232c">Dry with</text><text x="790.0" y="303.5" font-size="17" text-anchor="middle" fill="#18232c">warm air</text><rect x="370" y="255" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="480.0" y="281.5" font-size="17" text-anchor="middle" fill="#18232c">Grind into</text><text x="480.0" y="303.5" font-size="17" text-anchor="middle" fill="#18232c">granules</text><rect x="60" y="255" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="170.0" y="281.5" font-size="17" text-anchor="middle" fill="#18232c">Mix with</text><text x="170.0" y="303.5" font-size="17" text-anchor="middle" fill="#18232c">binder</text><rect x="60" y="440" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="170.0" y="466.5" font-size="17" text-anchor="middle" fill="#18232c">Press with heat</text><text x="170.0" y="488.5" font-size="17" text-anchor="middle" fill="#18232c">and pressure</text><rect x="370" y="440" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="480.0" y="477.5" font-size="17" text-anchor="middle" fill="#18232c">Inspect panels</text><rect x="680" y="440" width="220" height="75" rx="5" fill="#edf3f6" stroke="#536573"/><text x="790.0" y="466.5" font-size="17" text-anchor="middle" fill="#18232c">Pack and sell</text><text x="790.0" y="488.5" font-size="17" text-anchor="middle" fill="#18232c">suitable panels</text><path d="M280 132 L370 132" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 132 L680 132" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 170 L790 255" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 292 L590 292" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M370 292 L280 292" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M170 330 L170 440" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 477 L370 477" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 477 L680 477" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><rect x="370" y="195" width="220" height="40" rx="5" fill="#fbe8dc" stroke="#536573"/><text x="480.0" y="215.0" font-size="17" text-anchor="middle" fill="#18232c">Non-cork: leave process</text><path d="M480 170 V195" stroke="#384e60" marker-end="url(#arrow)"/><text x="390" y="378" font-size="16" text-anchor="start" fill="#18232c">Unsuitable panels → grind again</text><path d="M480 440 V330" fill="none" stroke="#384e60" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="225" font-size="17" text-anchor="start" fill="#18232c">Binder input ↓</text><text x="500" y="570" font-size="17" text-anchor="middle" fill="#18232c">Proposed process. No numerical conditions are specified.</text></g></svg>
